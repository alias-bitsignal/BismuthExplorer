<script>
function base58Encode(bytes) {
  const alphabet = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
  let n = 0n;
  for (let i = 0; i < bytes.length; i++) {
    n = (n << 8n) + BigInt(bytes[i]);
  }
  let encoded = "";
  while (n > 0n) {
    const rem = n % 58n;
    n = n / 58n;
    encoded = alphabet[Number(rem)] + encoded;
  }
  let pad = 0;
  for (let i = 0; i < bytes.length; i++) {
    if (bytes[i] === 0) pad++;
    else break;
  }
  return "1".repeat(pad) + encoded;
}

function looksLikeTxid(value) {
  if (!value || value.length !== 56) return false;
  if (/^[0-9a-fA-F]{56}$/.test(value)) return false;
  return /[+/=]/.test(value);
}

function looksLikeBase58(value) {
  return value && value.length > 56 && /^[1-9A-HJ-NP-Za-km-z]+$/.test(value);
}

function normalizeQuicksearchTxid(form) {
  const input = form.querySelector("#quicksearch");
  if (!input) return true;
  const value = (input.value || "").trim();
  if (!value || looksLikeBase58(value) || !looksLikeTxid(value)) return true;
  try {
    const bytes = new TextEncoder().encode(value);
    input.value = base58Encode(bytes);
  } catch (e) {
    return true;
  }
  return true;
}
</script>
